<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            try {
                var savedLang = localStorage.getItem('language') || 'fi';
                document.documentElement.lang = savedLang;
                document.documentElement.classList.add(savedLang !== 'fi' ? 'i18n-pending' : 'i18n-ready');
            } catch (err) {}
        })();
    </script>
    <style>
        html.i18n-pending body {
            visibility: hidden;
        }
    </style>
    <title>Eduko - verkkokauppa</title>
    <link rel="stylesheet" href="/verkkokauppa/styles/style.css">
    <link rel="stylesheet" href="/verkkokauppa/styles/accessibility.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="/verkkokauppa/images/edukosmall.png" type="image/png">
</head>
<body>

<!-- Toast Notification -->
<div id="toast-notification" class="toast-notification"></div>

<header class="main-header">
    <div class="header-container">
        <button class="menu-toggle" id="mobile-menu-btn" type="button" aria-label="Avaa navigaatio" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>

        <a href="/verkkokauppa/" class="logo">
            <span class="eduko-text">edu<span>ko</span></span> 
            <small>Kouvolan Ammattiopisto</small>
        </a>

        <div class="search-box">
            <input type="text" placeholder="Hae tuotteita..." data-i18n-placeholder="search_placeholder">
            <button type="button"><i class="fas fa-search"></i></button>
        </div>

        <div class="header-actions-mobile">
            <div class="cart-wrapper" id="cart-btn">
                <i class="fas fa-shopping-cart"></i>
                <span id="cart-count" class="cart-count">0</span>
            </div>
            <div class="header-right">
                <a href="/verkkokauppa/login" class="btn-primary" data-i18n="login_btn">Kirjaudu</a>
            </div>
            <div class="language-selector">
                <div id="selected-lang">🇫🇮 FI</div>
                <div id="lang-options" class="select-hide">
                    <div data-value="fi">🇫🇮 FI</div>
                    <div data-value="en">🇬🇧 EN</div>
                    <div data-value="sv">🇸🇪 SV</div>
                </div>
            </div>
        </div>
    </div>
</header>

<nav class="main-nav" id="main-navigation">
    <div class="nav-container">
        <div class="nav-links">
            <a href="/verkkokauppa/" class="active" data-i18n="all_ads">Kaikki ilmoitukset</a>
            <a href="/verkkokauppa/miten-ostat" data-i18n="how_to_buy">Miten ostat?</a>
            <a href="/verkkokauppa/myyntipalvelut" data-i18n="sales_services">Myyntipalvelut</a>
            <a href="/verkkokauppa/tieto" data-i18n="about_us">Tietoa meistä</a>
            <a href="https://www.eduko.fi/eduko/yhteystiedot/" data-i18n="contact">Yhteystiedot</a>
        </div>
    </div>
</nav>

<div class="layout-container">
    <aside class="sidebar">
        <h3 data-i18n="categories_title">Kategoriat</h3>
        <nav class="side-nav">
            <a href="/verkkokauppa/kategoria/3"><i class="fas fa-bolt"></i> <span data-i18n="cat_metal">Kone- ja metalliala</span></a>
            <a href="/verkkokauppa/kategoria/4"><i class="fas fa-truck"></i> <span data-i18n="cat_logistics">Logistiikka ja varasto</span></a>
            <a href="/verkkokauppa/kategoria/7"><i class="fas fa-paint-roller"></i> <span data-i18n="cat_construction">Rakennus ja pintakäsittely</span></a>
        </nav>
    </aside>

    <main class="content">
        <section class="hero-banner">
            <div class="hero-head">
                <button id="category-toggle-btn" class="category-toggle" type="button" aria-label="Avaa kategoriavalikko" aria-expanded="false">
                    <span class="line"></span>
                    <span class="line"></span>
                    <span class="line"></span>
                </button>

                <div class="hero-text">
                    <h1 data-i18n="latest_items">Tuoreimmat kohteet</h1>
                </div>
            </div>
        </section>
        <div class="product-grid"></div>
    </main>
</div>

<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div id="cart-modal" class="cart-modal hidden">
    <div class="cart-content">
        <div class="cart-header">
            <h2 data-i18n="cart_title">Ostoskori</h2>
            <button id="close-cart" type="button">&times;</button>
        </div>
        <div id="cart-items-list">
            <p class="empty-msg" data-i18n="cart_empty_message">Korisi on tyhjä.</p>
        </div>
        <div class="cart-footer">
            <div class="total-row">
                <span data-i18n="total_label">Yhteensä:</span>
                <span id="cart-total">0.00 €</span>
            </div>
            <div class="cart-footer-buttons">
                <button class="checkout-btn clear-cart-btn" id="clear-cart-btn" type="button" data-i18n="clear_cart">Tyhjennä ostoskori</button>
                <button class="checkout-btn" id="go-to-checkout" type="button" data-i18n="checkout_btn">Kassalle</button>
            </div>
        </div>
    </div>
</div>

<script src="/verkkokauppa/script/language.js"></script>
<script src="/verkkokauppa/script/accessibility.js"></script>
<script src="/verkkokauppa/script/script.js"></script>
</body>
</html>
