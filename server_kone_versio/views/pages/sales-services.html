<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            try {
                var savedLang = localStorage.getItem('language') || 'fi';
                document.documentElement.lang = savedLang;
                document.documentElement.classList.add(savedLang !== 'fi' ? 'i18n-pending' : 'i18n-ready');
            } catch (err) {}
        })();
    </script>
    <style>
        html.i18n-pending body {
            visibility: hidden;
        }
    </style>
    <title>Myyntipalvelut - Eduko Verkkokauppa</title>
    <link rel="stylesheet" href="/verkkokauppa/styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="/verkkokauppa/images/edukosmall.png" type="image/png">
</head>
<body>

<header class="main-header">
    <div class="header-container">
        <button class="menu-toggle" id="mobile-menu-btn" type="button" aria-label="Avaa navigaatio" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>

        <a href="/verkkokauppa/" class="logo">
            <span class="eduko-text">edu<span>ko</span></span>
            <small>Kouvolan Ammattiopisto</small>
        </a>

        <div class="search-box">
            <input type="text" placeholder="Hae tuotteita..." data-i18n-placeholder="search_placeholder">
            <button type="button"><i class="fas fa-search"></i></button>
        </div>

        <div class="header-actions-mobile">
            <div class="cart-wrapper" id="cart-btn">
                <i class="fas fa-shopping-cart"></i>
                <span id="cart-count">0</span>
            </div>

            <div class="header-right">
                <a href="/verkkokauppa/login" class="btn-primary" data-i18n="login_btn">Kirjaudu</a>
            </div>

            <div class="language-selector">
                <div id="selected-lang">🇫🇮 FI</div>
                <div id="lang-options" class="select-hide">
                    <div data-value="fi">🇫🇮 FI</div>
                    <div data-value="en">🇬🇧 EN</div>
                    <div data-value="sv">🇸🇪 SV</div>
                </div>
            </div>
        </div>
    </div>
</header>

<nav class="main-nav" id="main-navigation">
    <div class="nav-container">
        <div class="nav-links">
            <a href="/verkkokauppa/" data-i18n="all_ads">Kaikki ilmoitukset</a>
            <a href="/verkkokauppa/miten-ostat" data-i18n="how_to_buy">Miten ostat?</a>
            <a href="/verkkokauppa/myyntipalvelut" class="active" data-i18n="sales_services">Myyntipalvelut</a>
            <a href="/verkkokauppa/tieto" data-i18n="about_us">Tietoa meistä</a>
            <a href="https://www.eduko.fi/eduko/yhteystiedot/" data-i18n="contact">Yhteystiedot</a>
        </div>
    </div>
</nav>

<div class="layout-container">
    <main class="content" style="grid-column: 1 / -1; text-align: center; padding: 80px 20px;">
        <div class="construction-notice" style="background: #fff3cd; border: 2px solid #ffc107; border-radius: 8px; padding: 40px; max-width: 600px; margin: 0 auto;">
            <h1 style="color: #333; margin-bottom: 20px;" data-i18n="page_under_construction_title">Sivu on vielä muokkauksella</h1>
            <p style="font-size: 18px; color: #555; margin-bottom: 30px;" data-i18n="page_under_construction_text">
                Tämä sivu on parhaillaan kehitteillä. Tulemme takaisin pian lisätyllä sisällöllä.
            </p>
            <a href="/verkkokauppa/" class="btn-primary" style="display: inline-block; padding: 12px 30px; text-decoration: none;" data-i18n="back_to_main_page">
                Palaa pääsivulle
            </a>
        </div>
    </main>
</div>

<script src="/verkkokauppa/script/language.js"></script>
<script src="/verkkokauppa/script/script.js"></script>
</body>
</html>
