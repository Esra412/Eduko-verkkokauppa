<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            try {
                var savedLang = localStorage.getItem('language') || 'fi';
                document.documentElement.lang = savedLang;
                document.documentElement.classList.add(savedLang !== 'fi' ? 'i18n-pending' : 'i18n-ready');
            } catch (err) {}
        })();
    </script>
    <style>
        html.i18n-pending body {
            visibility: hidden;
        }
    </style>
    <title data-i18n="cart_page_title">Ostoskori - Eduko</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="/verkkokauppa/images/edukosmall.png" type="image/png">
    <link rel="stylesheet" href="/verkkokauppa/styles/cart.css">
    <script src="/verkkokauppa/script/language.js"></script>
</head>
<body>

<div class="cart-container">
    <div class="back-nav">
        <a href="/verkkokauppa/"><i class="fas fa-arrow-left"></i> <span data-i18n="continue_shopping">Jatka ostoksia</span></a>
    </div>

    <h2><i class="fas fa-shopping-cart"></i> <span data-i18n="cart_title">Ostoskori</span></h2>

    <!-- Kori sisältö -->
    <div id="cart-list"></div>

    <!-- Yhteenveto ja napit -->
    <div style="margin-top: 20px; text-align: right; display: flex; flex-direction: column; gap: 10px; align-items: flex-end;">
        <h3><span data-i18n="total_label">Yhteensä:</span> <span id="cart-total">0.00</span> €</h3>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; width: 100%;">
            <button class="checkout-btn" id="empty-cart-btn" data-i18n="clear_cart" style="background: #ff4444;">Tyhjennä ostoskori</button>
            <button class="checkout-btn" id="show-form-btn" data-i18n="continue_order">Jatka tilaamaan</button>
        </div>
    </div>

    <!-- Tilauslomake -->
    <div id="checkout-form-container" style="display: none; margin-top: 30px; border-top: 2px solid var(--gold); padding-top: 20px;">
        <h3 data-i18n="delivery_info">Toimitustiedot</h3>
        <input type="text" id="fname" placeholder="Etunimi" data-i18n-placeholder="first_name" required>
        <input type="text" id="lname" placeholder="Sukunimi" data-i18n-placeholder="last_name" required>
        <input type="email" id="customer-email" placeholder="Sähköposti" data-i18n-placeholder="customer_email" required>
        <input type="tel" id="phone" placeholder="Puhelinnumero" data-i18n-placeholder="phone" required>
        <input type="text" id="address" placeholder="Osoite" data-i18n-placeholder="address" required>
        <input type="text" id="postcode" placeholder="Postinumero" data-i18n-placeholder="postcode" required>
        <input type="text" id="city" placeholder="Kaupunki" data-i18n-placeholder="city" required>
        <button class="checkout-btn" id="pay-button" style="background: var(--gold);" data-i18n="proceed_to_payment">Siirry maksamaan</button>
    </div>
</div>

<script src="/verkkokauppa/script/cart.js"></script>

</body>
</html>
