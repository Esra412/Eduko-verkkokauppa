<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            try {
                var savedLang = localStorage.getItem('language') || 'fi';
                document.documentElement.lang = savedLang;
                document.documentElement.classList.add(savedLang !== 'fi' ? 'i18n-pending' : 'i18n-ready');
            } catch (err) {}
        })();
    </script>
    <style>
        html.i18n-pending body {
            visibility: hidden;
        }
    </style>
    <title>Kiitos tilauksesta! | Eduko</title>
    <link rel="stylesheet" href="/verkkokauppa/styles/style.css">
    <link rel="stylesheet" href="/verkkokauppa/styles/accessibility.css">
    <link rel="stylesheet" href="/verkkokauppa/styles/cookie-consent.css">
    <link rel="icon" href="/verkkokauppa/images/edukosmall.png" type="image/png">
    <link rel="stylesheet" href="/verkkokauppa/styles/success.css" />
</head>
<body>

<div class="success-container">
    <div class="success-icon">✓</div>
    <h1 data-i18n="payment_success_header">Maksu onnistui!</h1>
    <p data-i18n="payment_thanks">Kiitos tilauksestasi Eduko-verkkokaupasta.</p>
    
    <div id="order-info" style="display:none;" class="order-id-box">
        <div class="order-id-label" data-i18n="order_number_label">Tilausnro</div>
        <div class="order-id-value" id="display-id"></div>
    </div>

    <p data-i18n="payment_confirmation_info">Vahvistus on lähetetty sähköpostiisi. Voit nyt sulkea tämän sivun tai palata takaisin etusivulle.</p>
    
    <div class="receipt-actions">
        <button id="download-receipt" class="btn-download" type="button">Lataa kuitti PDF</button>
        <a href="/verkkokauppa/" class="btn-home" data-i18n="back_to_home_btn">Palaa etusivulle</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="/verkkokauppa/script/language.js"></script>
<script src="/verkkokauppa/script/accessibility.js"></script>
<script src="/verkkokauppa/script/cookie-consent.js"></script>
<script src="/verkkokauppa/script/success.js"></script>
</body>
</html>
