<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            try {
                var savedLang = localStorage.getItem('language') || 'fi';
                document.documentElement.lang = savedLang;
                document.documentElement.classList.add(savedLang !== 'fi' ? 'i18n-pending' : 'i18n-ready');
            } catch (err) {}
        })();
    </script>
    <style>
        html.i18n-pending body {
            visibility: hidden;
        }
    </style>
    <title data-i18n="login_title">Kirjautuminen | Vahvistuskoodi</title>
    <link rel="stylesheet" href="/verkkokauppa/styles/login.css">
    <link rel="stylesheet" href="/verkkokauppa/styles/accessibility.css">
    <link rel="icon" href="/verkkokauppa/images/edukosmall.png" type="image/png">
</head>
<body>
<a href="/verkkokauppa/" class="back-button">Takaisin etusivulle</a>
<div class="login-card">
    <div id="step1">
        <h2 data-i18n="login_header">Admin sisään</h2>
        <div class="input-group">
            <label data-i18n="email_label">Sähköpostiosoite</label>
            <input type="email" id="email" data-i18n-placeholder="email_placeholder" placeholder="admin@example.com" required>
        </div>
        <div class="input-group">
            <label data-i18n="password_label">Salasana</label>
            <input type="password" id="password" data-i18n-placeholder="password_placeholder" placeholder="********" required>
        </div>
        <button type="button" onclick="sendCode()" data-i18n="send_code_btn">Lähetä vahvistuskoodi</button>
        <div id="error-step1" class="message error"></div>
    </div>

    <div id="step2" style="display:none;">
        <h2 data-i18n="verify_header">Vahvista kirjautuminen</h2>
        <p data-i18n="verify_info" style="font-size: 0.9rem; color: #666;">Lähetimme 6-numeroisen koodin sähköpostiisi.</p>
        <div class="input-group">
            <label data-i18n="code_label">Vahvistuskoodi</label>
            <input type="text" id="code" name="verification_code" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other" data-i18n-placeholder="code_placeholder" placeholder="123456" style="text-align: center; font-weight: bold;">
        </div>
        <button type="button" onclick="verifyCode()" data-i18n="login_confirm_btn">Vahvista ja Admin</button>
        <button type="button" onclick="location.reload()" data-i18n="back_btn" style="background: none; color: #666; font-size: 0.8rem;">Palaa takaisin</button>
        <div id="error-step2" class="message error"></div>
    </div>
    </div>
</div>

<script src="/verkkokauppa/script/language.js"></script>
<script src="/verkkokauppa/script/accessibility.js"></script>
<script src="/verkkokauppa/script/login.js"></script>
</body>
</html>
