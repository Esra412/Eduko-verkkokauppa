<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virhe - Eduko Verkkokauppa</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }
        .card {
            max-width: 560px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
            padding: 36px;
        }
        h1 {
            margin-top: 0;
            color: #b0a078;
        }
        p {
            line-height: 1.7;
            margin: 20px 0;
        }
        a.button {
            display: inline-block;
            padding: 12px 26px;
            border-radius: 999px;
            background: #b0a078;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s ease;
        }
        a.button:hover {
            background: #96835d;
        }
        .hint {
            margin-top: 24px;
            color: #666;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="card">
            <h1>Jokin meni pieleen</h1>
            <p>Valitettavasti sivua ei pystytty näyttämään nyt. Yritä päivittää sivu tai tule hetken kuluttua takaisin.</p>
            <p class="hint">Jos ongelma jatkuu, ota yhteyttä järjestelmän ylläpitoon tai tarkista palvelimen tilanne.</p>
            <a class="button" href="/">Palaa etusivulle</a>
        </div>
    </div>
    <script src="/verkkokauppa/script/cookie-consent.js"></script>
</body>
</html>
