<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ostoskori - Eduko</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="/images/edukosmall.png" type="image/png">
    <style>
        /* TÄMÄ CSS KORJAA KUVASSA NÄKYVÄT VIRHEET */
        :root {
            --gold: #b0a078;
            --dark: #333;
            --light-bg: #f9f7f2;
        }

        body {
            background-color: var(--light-bg);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px; /* Pieni tila reunoille mobiilissa */
        }

        /* Päälaatikko, joka kuvissasi karkaili */
        .cart-container {
            max-width: 600px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            min-height: 300px;
        }

        .back-nav {
            margin-bottom: 20px;
        }

        .back-nav a {
            text-decoration: none;
            color: var(--gold);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2 {
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 2px solid var(--light-bg);
            padding-bottom: 10px;
            margin-top: 0;
        }

        /* Tuoterivien asettelu */
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            gap: 10px;
        }

        .item-info {
            flex: 1;
        }

        .item-info h4 { margin: 0; }

        .qty-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }

        .qty-btn {
            background: #eee;
            border: none;
            width: 25px;
            height: 25px;
            cursor: pointer;
            border-radius: 4px;
        }

        .price-box {
            text-align: right;
            font-weight: bold;
        }

        .remove-link {
            color: red;
            font-size: 0.8rem;
            cursor: pointer;
            display: block;
            margin-top: 5px;
        }

        /* Tyhjä kori -näkymä (Korjaa kuvassa olevan sekasotkun) */
        .empty-state {
            text-align: center;
            padding: 40px 10px;
        }

        .empty-state i {
            font-size: 3rem;
            color: #ccc;
            margin-bottom: 15px;
        }

        /* Yhteenveto ja napit */
        .summary {
            margin-top: 20px;
            text-align: right;
        }

        .checkout-btn {
            background: var(--dark);
            color: white;
            border: none;
            padding: 15px 25px;
            width: 100%;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }

        /* Lomake */
        #order-form {
            display: none;
            margin-top: 20px;
            border-top: 2px solid var(--gold);
            padding-top: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="cart-container">
    <div class="back-nav">
        <a href="/"><i class="fas fa-arrow-left"></i> Jatka ostoksia</a>
    </div>

    <h2><i class="fas fa-shopping-cart"></i> Ostoskorisi</h2>

    <div id="cart-content">
        </div>

    <div id="cart-footer" style="display:none;">
        <div class="summary">
            <h3>Yhteensä: <span id="total-price">0.00</span> €</h3>
            <button class="checkout-btn" id="show-form">Jatka tilaamaan</button>
        </div>
    </div>

    <div id="order-form">
        <h3>Toimitustiedot</h3>
        <input type="text" id="name" placeholder="Nimi">
        <input type="email" id="email" placeholder="Sähköposti">
        <input type="text" id="addr" placeholder="Osoite">
        <button class="checkout-btn" style="background: var(--gold);">Vahvista ja maksa</button>
    </div>
</div>

<script>
    function updateCart() {
        let cart = JSON.parse(localStorage.getItem('eduko_cart')) || [];
        const content = document.getElementById('cart-content');
        const footer = document.getElementById('cart-footer');
        let total = 0;

        if (cart.length === 0) {
            content.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-shopping-basket"></i>
                    <p><b>Ostoskorisi on tyhjä.</b></p>
                    <a href="/" style="color:var(--gold)">Palaa tästä kauppaan &raquo;</a>
                </div>`;
            footer.style.display = 'none';
            return;
        }

        footer.style.display = 'block';
        content.innerHTML = '';

        cart.forEach((item, i) => {
            const p = parseFloat(item.price.replace(',', '.'));
            const q = item.quantity || 1;
            total += p * q;

            content.innerHTML += `
                <div class="cart-item">
                    <div class="item-info">
                        <h4>${item.name}</h4>
                        <div class="qty-box">
                            <button class="qty-btn" onclick="changeQty(${i}, -1)">-</button>
                            <span>${q}</span>
                            <button class="qty-btn" onclick="changeQty(${i}, 1)">+</button>
                        </div>
                    </div>
                    <div class="price-box">
                        ${(p * q).toFixed(2)} €
                        <span class="remove-link" onclick="remove(${i})">Poista</span>
                    </div>
                </div>`;
        });

        document.getElementById('total-price').innerText = total.toFixed(2);
    }

    window.changeQty = (i, c) => {
        let cart = JSON.parse(localStorage.getItem('eduko_cart'));
        cart[i].quantity = (cart[i].quantity || 1) + c;
        if (cart[i].quantity < 1) cart.splice(i, 1);
        localStorage.setItem('eduko_cart', JSON.stringify(cart));
        updateCart();
    };

    window.remove = (i) => {
        let cart = JSON.parse(localStorage.getItem('eduko_cart'));
        cart.splice(i, 1);
        localStorage.setItem('eduko_cart', JSON.stringify(cart));
        updateCart();
    };

    document.getElementById('show-form').onclick = () => {
        document.getElementById('order-form').style.display = 'block';
        document.getElementById('show-form').style.display = 'none';
    };

    updateCart();
</script>

</body>
</html>
