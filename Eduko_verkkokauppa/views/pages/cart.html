<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ostoskori - Eduko</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="/images/edukosmall.png" type="image/png">
    <style>
        .cart-wrapper { max-width: 800px; margin: 50px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .cart-item { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee; gap: 15px; }
        .cart-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 5px; flex-shrink: 0; }
        .cart-details { flex: 1; margin-left: 20px; }
        .cart-item-price { min-width: 100px; text-align: right; }
        .quantity-control { display: flex; align-items: center; gap: 8px; border: 1px solid #ddd; border-radius: 4px; padding: 4px; background: #f9f9f9; }
        .quantity-btn { border: none; background: none; width: 28px; height: 28px; cursor: pointer; font-size: 1rem; font-weight: bold; color: #b0a078; transition: background 0.2s; }
        .quantity-btn:hover { background: #f0f0f0; border-radius: 3px; }
        .quantity-display { width: 35px; text-align: center; font-weight: bold; }
        .remove-btn { color: #e74c3c; cursor: pointer; border: none; background: none; font-size: 1.1rem; transition: color 0.2s; }
        .remove-btn:hover { color: #c0392b; }
        .cart-summary { margin-top: 30px; text-align: right; }
        
        /* Lomakkeen tyylit */
        #checkout-form-container { 
            display: none; 
            margin-top: 30px; 
            padding: 25px; 
            background: #fdfaf3; 
            border: 1px solid #b0a078; 
            border-radius: 8px; 
            text-align: left;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }
        
        .empty-cart { text-align: center; padding: 40px; }
        .back-link { text-decoration: none; color: #b0a078; font-weight: bold; margin-bottom: 20px; display: inline-block; }
    </style>
</head>
<body>

<div class="cart-wrapper">
    <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Jatka ostoksia</a>
    <h2><i class="fas fa-shopping-cart"></i> Ostoskorisi</h2>
    
    <div id="cart-list"></div>

    <div class="cart-summary">
        <h3>Yhteensä: <span id="cart-total">0.00</span> €</h3>
        <button id="show-form-btn" class="bid-btn" style="padding: 15px 30px; font-size: 1.1rem; margin-top: 10px;">
            Jatka tilaamaan <i class="fas fa-chevron-right"></i>
        </button>
    </div>

    <div id="checkout-form-container">
        <h3 style="border-bottom: 2px solid #b0a078; padding-bottom: 10px; margin-bottom: 20px;">Toimitustiedot</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Etunimi</label>
                <input type="text" id="fname" placeholder="Matti" required>
            </div>
            <div class="form-group">
                <label>Sukunimi</label>
                <input type="text" id="lname" placeholder="Meikäläinen" required>
            </div>
        </div>
        <div class="form-group">
            <label>Sähköposti (vahvistusta varten)</label>
            <input type="email" id="customer-email" placeholder="matti@esimerkki.fi" required>
        </div>
        <div class="form-group">
            <label>Puhelinnumero</label>
            <input type="tel" id="phone" placeholder="040 123 4567" required>
        </div>
        <div class="form-group">
            <label>Katuosoite</label>
            <input type="text" id="address" placeholder="Esimerkkikatu 12" required>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Postinumero</label>
                <input type="text" id="postcode" placeholder="00100" required>
            </div>
            <div class="form-group">
                <label>Kunta</label>
                <input type="text" id="city" placeholder="Kouvola" required>
            </div>
        </div>
        <button id="pay-button" class="bid-btn" style="width: 100%; margin-top: 15px; padding: 15px;">
            Siirry maksamaan <i class="fas fa-credit-card"></i>
        </button>
    </div>
</div>

<script>
    const cartList = document.getElementById('cart-list');
    const totalElem = document.getElementById('cart-total');
    const showFormBtn = document.getElementById('show-form-btn');
    const formContainer = document.getElementById('checkout-form-container');
    const payBtn = document.getElementById('pay-button');

    function renderCart() {
        let cart = JSON.parse(localStorage.getItem('eduko_cart')) || [];
        cartList.innerHTML = "";
        let total = 0;

        if (cart.length === 0) {
            cartList.innerHTML = `
                <div class='empty-cart'>
                    <h3>Ostoskorisi on tyhjä.</h3>
                    <p><a href='/' style='color: #b0a078;'>Palaa ostoksille tästä.</a></p>
                </div>`;
            totalElem.innerText = "0.00";
            showFormBtn.style.display = 'none';
            formContainer.style.display = 'none';
            return;
        }

        showFormBtn.style.display = 'inline-block';

        cart.forEach((item, index) => {
            const price = parseFloat(item.price.toString().replace(',', '.'));
            const quantity = item.quantity || 1;
            const itemTotal = price * quantity;
            total += itemTotal;

            cartList.innerHTML += `
                <div class="cart-item" data-item-index="${index}">
                    <img src="${item.image || '/images/no-image.png'}" alt="">
                    <div class="cart-details">
                        <h4>${item.name}</h4>
                        <p>${price.toFixed(2)} €</p>
                        <div class="quantity-control">
                            <button class="quantity-btn decrease-btn" data-index="${index}">−</button>
                            <span class="quantity-display" data-index="${index}">${quantity}</span>
                            <button class="quantity-btn increase-btn" data-index="${index}">+</button>
                        </div>
                    </div>
                    <div class="cart-item-price">
                        <p style="font-weight: bold;">${itemTotal.toFixed(2)} €</p>
                        <button class="remove-btn" onclick="removeItem(${index})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
        });
        totalElem.innerText = total.toFixed(2);
        
        // Liitä event listenerit quantity nappeihin
        attachQuantityListeners();
    }


    
    function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem('eduko_cart')) || [];
        cart.splice(index, 1);
        localStorage.setItem('eduko_cart', JSON.stringify(cart));
        renderCart();
        
        const count = document.getElementById('cart-count');
        if (count) count.innerText = cart.length;
    }

    // Attach event listeners keille quantity nappeihin
    function attachQuantityListeners() {
        document.querySelectorAll('.increase-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const index = parseInt(btn.dataset.index);
                updateQuantity(index, 1);
            });
        });

        document.querySelectorAll('.decrease-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const index = parseInt(btn.dataset.index);
                updateQuantity(index, -1);
            });
        });
    }

    // Päivitä tuotteen määrä ostoskorissa
    async function updateQuantity(index, change) {
        let cart = JSON.parse(localStorage.getItem('eduko_cart')) || [];
        const item = cart[index];

        if (!item) return;

        // Ensin haetaan varastosaldo kannasta
        try {
            const response = await fetch(`/api/products/${item.id}`);
            const product = await response.json();
            const maxStock = product.stock; // Käytä varastosaldoa suoraan

            // Päivitä määrä
            item.quantity = (item.quantity || 1) + change;

            // Minimiä kontrolloi 1, jos 0 tai alle, poista tuote
            if (item.quantity <= 0) {
                removeItem(index);
                return;
            }

            // Maksimiä kontrolloi
            if (item.quantity > maxStock) {
                item.quantity = maxStock;
            }

            // Tallenna muutokset
            cart[index] = item;
            localStorage.setItem('eduko_cart', JSON.stringify(cart));
            renderCart();
        } catch (err) {
            console.error("Virhe tuotteen varastosaldon haussa:", err);
            // Fallback: aseta määrä 1
            item.quantity = (item.quantity || 1) + change;
            if (item.quantity <= 0) {
                removeItem(index);
                return;
            }
            if (item.quantity > 1) {
                item.quantity = 1;
            }
            cart[index] = item;
            localStorage.setItem('eduko_cart', JSON.stringify(cart));
            renderCart();
        }
    }

    // "Jatka tilaamaan" -painikkeen logiikka
    showFormBtn.addEventListener('click', () => {
        formContainer.style.display = 'block';
        showFormBtn.style.display = 'none';
        formContainer.scrollIntoView({ behavior: 'smooth' });
    });

    // Lopullinen maksun luonti
    payBtn.addEventListener('click', async () => {
        const customerData = {
            fname: document.getElementById('fname').value,
            lname: document.getElementById('lname').value,
            email: document.getElementById('customer-email').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value,
            postcode: document.getElementById('postcode').value,
            city: document.getElementById('city').value
        };

        // Validaatio
        if (Object.values(customerData).some(val => val.trim() === "")) {
            alert("Täytä kaikki osoitetiedot jatkaaksesi.");
            return;
        }

        let cart = JSON.parse(localStorage.getItem('eduko_cart')) || [];
        
        // Laske yhteissumma ottamalla huomioon määrät
        const totalAmount = cart.reduce((sum, item) => {
            const price = parseFloat(item.price.toString().replace(',', '.'));
            const quantity = item.quantity || 1;
            return sum + (price * quantity);
        }, 0);

        payBtn.innerText = "Valmistellaan maksua...";
        payBtn.disabled = true;

        try {
            const response = await fetch('/api/paytrail/create-payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    items: cart,
                    amount: totalAmount,
                    customer: customerData
                })
            });

            const data = await response.json();

            if (data.href) {
                window.location.href = data.href;
            } else {
                alert("Maksun luominen epäonnistui. Yritä uudelleen.");
                payBtn.innerText = "Siirry maksamaan";
                payBtn.disabled = false;
            }
        } catch (err) {
            console.error("Yhteysvirhe:", err);
            alert("Yhteysvirhe palvelimeen.");
            payBtn.disabled = false;
        }
    });

    // Alustetaan kori heti
    renderCart();
</script>

</body>
</html>
